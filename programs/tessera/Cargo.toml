[package]
name = "tessera"
version = "0.1.0"
description = "Tessera residual-v1 economic provenance program (T03)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "tessera"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
solana-sha256-hasher = "3"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
solana-pubkey = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
